  <text x="19.5" y="84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="700" fill="#f8fafc">Bara dagens pass</text>
  <text x="19.5" y="88.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="2.45" fill="#a8b3c4">Öppna appen – passet ligger redan framme.</text>
