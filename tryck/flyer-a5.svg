  <text x="19.5" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="3.5" font-weight="700" fill="#f8fafc">Redskap hemma</text>
  <text x="19.5" y="102.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="2.45" fill="#a8b3c4">Saknar du något? Du får ett förslag direkt.</text>
